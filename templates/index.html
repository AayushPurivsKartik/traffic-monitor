<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .card { background-color: #1e293b; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="p-6">

    <!-- Header -->
    <div class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-blue-400">VisionAnalytics</h1>
            <p class="text-gray-400">Real-time People Tracking & Heatmaps</p>
        </div>
        <div class="text-right">
            <div class="inline-flex items-center px-3 py-1 rounded-full bg-green-900 text-green-300 text-sm font-medium">
                <span class="w-2 h-2 mr-2 bg-green-400 rounded-full animate-pulse"></span>
                System Active
            </div>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Video Feed (Takes up 2 columns) -->
        <div class="lg:col-span-2 card flex flex-col justify-center items-center bg-black border border-gray-700 overflow-hidden">
            <h2 class="text-lg font-semibold mb-4 self-start text-gray-300">Live Feed + Heatmap Overlay</h2>
            <div class="relative w-full rounded-lg overflow-hidden shadow-lg">
                <img src="{{ url_for('video_feed') }}" class="w-full h-auto object-contain" alt="Video Feed">
            </div>
        </div>

        <!-- Stats Column -->
        <div class="flex flex-col gap-6">
            
            <!-- Counter Card -->
            <div class="card text-center">
                <h3 class="text-gray-400 text-sm uppercase tracking-wide">Total Entries</h3>
                <p id="count-display" class="text-5xl font-bold text-white mt-2">0</p>
            </div>

            <!-- Active Users Card -->
            <div class="card text-center">
                <h3 class="text-gray-400 text-sm uppercase tracking-wide">Currently in Frame</h3>
                <p id="active-display" class="text-5xl font-bold text-blue-400 mt-2">0</p>
            </div>

            <!-- Dwell Time Card -->
            <div class="card text-center">
                <h3 class="text-gray-400 text-sm uppercase tracking-wide">Avg. Dwell Time (sec)</h3>
                <p id="dwell-display" class="text-5xl font-bold text-yellow-400 mt-2">0.0s</p>
            </div>

            <!-- Chart -->
            <div class="card">
                <h3 class="text-gray-400 text-sm mb-4">Recent Dwell Durations</h3>
                <canvas id="dwellChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Initialize Chart
        const ctx = document.getElementById('dwellChart').getContext('2d');
        const dwellChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['1', '2', '3', '4', '5'],
                datasets: [{
                    label: 'Seconds',
                    data: [0, 0, 0, 0, 0],
                    backgroundColor: 'rgba(59, 130, 246, 0.5)',
                    borderColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { grid: { display: false } } },
                plugins: { legend: { display: false } }
            }
        });

        // Fetch Data Every 1 Second
        function updateStats() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    // Update Text Stats
                    document.getElementById('count-display').innerText = data.counts.down;
                    document.getElementById('active-display').innerText = data.current_people;
                    document.getElementById('dwell-display').innerText = data.avg_dwell_time + "s";

                    // Update Chart
                    if (data.recent_dwells.length > 0) {
                        dwellChart.data.datasets[0].data = data.recent_dwells;
                        dwellChart.data.labels = data.recent_dwells.map((_, i) => i + 1);
                        dwellChart.update();
                    }
                })
                .catch(err => console.error("Error fetching stats:", err));
        }

        setInterval(updateStats, 1000);
    </script>
</body>
</html>
